name: Feature request
description: Propose a change within the v0.1 scope or a post-v0.1 harness adapter.
title: "[feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        v0.1 is deliberately limited to Claude Code and Codex. A third harness requires an ADR comparing the tap point and token semantics.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can you not see or do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: The smallest useful change. Name the component and the data source.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other taps, schemas, or scope cuts.
    validations:
      required: false

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      options:
        - v0.1 Claude Code / Codex
        - Post-v0.1 harness adapter
        - Dashboard / export
        - Packaging / Tauri
        - Documentation
    validations:
      required: true

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This proposal does not require storing prompts, tool output, or message bodies.
          required: true
