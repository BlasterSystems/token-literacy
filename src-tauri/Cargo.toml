[package]
name = "tokenledger-shell"
version = "0.1.0"
description = "token-literacy tray shell"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde_json = "1"

[profile.release]
strip = true
lto = true
codegen-units = 1
